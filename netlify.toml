[build]
base = "apps/web"
command = "corepack pnpm build"
publish = ".next"

[build.environment]
NODE_VERSION = "24"
PNPM_VERSION = "10.34.5"

[functions]
directory = "netlify/functions"

[[plugins]]
package = "@netlify/plugin-nextjs"

[[redirects]]
from = "/"
to = "/demo"
status = 302
force = true
